spring:
  datasource:
    url: jdbc:h2:mem:blueai-auth-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  jwt:
    issuer: blueai-auth-test
    audience: blueai-api-test
    secret: dGVzdC1vbmx5LWJsdWVhaS1qd3Qtc2VjcmV0LTMyLWJ5dGVzLW1pbmltdW0=
    access-token-ttl: 5m
    refresh-token-ttl: 1d
  cors:
    allowed-origins:
      - http://localhost:3000

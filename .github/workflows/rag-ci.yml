name: RAG Chatbot CI

on:
  push:
    branches:
      - main
      - feature/rag-chatbot
    paths:
      - "rag-chatbot/**"
      - ".github/workflows/rag-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "rag-chatbot/**"
      - ".github/workflows/rag-ci.yml"

permissions:
  contents: read

concurrency:
  group: rag-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python and knowledge base
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: rag-chatbot

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: rag-chatbot/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q chatbot.py scripts tests

      - name: Validate knowledge base
        run: python scripts/validate_kb.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Scan committed files for common secrets
        run: python scripts/check_secrets.py --root ..

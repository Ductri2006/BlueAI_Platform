global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: blueai
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: auth-api
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: [auth-api:8080]
        labels:
          component: api

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

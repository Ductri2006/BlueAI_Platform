global:
  resolve_timeout: 5m

route:
  receiver: blueai-incident-webhook
  group_by: [alertname, service, environment]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: blueai-incident-webhook
      repeat_interval: 1h

receivers:
  - name: blueai-incident-webhook
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true

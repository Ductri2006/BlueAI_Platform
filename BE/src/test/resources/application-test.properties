spring.datasource.url=jdbc:h2:mem:blueai-auth-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.placeholders.text_type=CLOB
spring.flyway.placeholders.long_text_type=LONGTEXT
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=fake-user
spring.mail.password=fake-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.test-connection=false
app.auth.password-reset.enabled=false
app.auth.password-reset.mail-from=test@blueai.local
logging.structured.format.console=ecs
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.health.redis.enabled=false
# Test mail uses a fake localhost SMTP endpoint; it must not make the otherwise
# healthy actuator aggregate report DOWN when no SMTP server is running.
management.health.mail.enabled=false

app.jwt.issuer=blueai-auth-test
app.jwt.audience=blueai-api-test
app.jwt.secret=dGVzdC1vbmx5LWJsdWVhaS1qd3Qtc2VjcmV0LTMyLWJ5dGVzLW1pbmltdW0=
app.jwt.access-token-ttl=5m
app.jwt.refresh-token-ttl=1d
app.cors.allowed-origins=http://localhost:3000
app.documents.storage-dir=target/test-uploaded-documents
app.documents.max-size-bytes=20971520
app.worker.api-key=test-worker-api-key-for-integration-tests
app.auth.public-registration-enabled=true
app.bootstrap-admin.email=
app.bootstrap-admin.password=
app.rag.retrieval-base-url=
app.rag.llm-base-url=
app.rag.llm-api-key=
app.rag.llm-model=
app.widget.protection.max-session-creations-per-window=1000
app.widget.protection.max-messages-per-window-per-client=1000
app.widget.protection.max-messages-per-window-per-session=1000
app.widget.protection.max-messages-per-session=1000

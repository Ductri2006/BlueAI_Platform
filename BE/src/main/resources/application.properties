server.port=${SERVER_PORT:8080}
server.shutdown=graceful

app.auth.public-registration-enabled=${APP_PUBLIC_REGISTRATION_ENABLED:false}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@blueai.local}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:BlueAiAdmin123!}
app.bootstrap-admin.full-name=${APP_BOOTSTRAP_ADMIN_FULL_NAME:BlueAI Administrator}

spring.application.name=blueai-auth-api
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blueai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:replace-with-db-password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.redis.repositories.enabled=false

spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

app.jwt.issuer=${APP_JWT_ISSUER:blueai-auth}
app.jwt.audience=${APP_JWT_AUDIENCE:blueai-api}
app.jwt.secret=${APP_JWT_SECRET:ZGV2LW9ubHktYmx1ZWFpLWp3dC1zZWNyZXQtbXVzdC1iZS1yZXBsYWNlZCE=}
app.jwt.access-token-ttl=${APP_JWT_ACCESS_TTL:15m}
app.jwt.refresh-token-ttl=${APP_JWT_REFRESH_TTL:30d}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.widget-allowed-origins=${APP_WIDGET_ALLOWED_ORIGINS:*}
app.documents.storage-dir=${APP_DOCUMENT_STORAGE_DIR:./storage/documents}
app.documents.max-size-bytes=${APP_DOCUMENT_MAX_SIZE_BYTES:20971520}
app.documents.processing-timeout=${APP_DOCUMENT_PROCESSING_TIMEOUT:10m}
app.worker.api-key=${APP_WORKER_API_KEY:local-worker-api-key-change-before-production}
app.rag.retrieval-base-url=${APP_RAG_RETRIEVAL_BASE_URL:http://127.0.0.1:8000}
app.rag.retrieval-search-path=${APP_RAG_RETRIEVAL_SEARCH_PATH:/v1/retrieval/search}
app.rag.llm-base-url=${APP_LLM_BASE_URL:http://127.0.0.1:8000}
app.rag.llm-chat-path=${APP_LLM_CHAT_PATH:/v1/chat/completions}
app.rag.llm-api-key=${APP_LLM_API_KEY:internal-rag-service}
app.rag.llm-model=${APP_LLM_MODEL:gemini-3.5-flash-lite}
app.rag.allow-shared-demo-knowledge=${APP_RAG_ALLOW_SHARED_DEMO_KNOWLEDGE:false}
app.widget.cleanup-interval=${APP_WIDGET_CLEANUP_INTERVAL:15m}

# Public-widget abuse protection. Redis is enabled by Compose and provides the
# shared state required when the API runs on more than one instance. Keep it
# disabled only when running the backend locally without Redis.
app.widget.protection.redis-enabled=${APP_WIDGET_REDIS_ENABLED:false}
app.widget.protection.redis-key-prefix=${APP_WIDGET_REDIS_KEY_PREFIX:blueai:widget:}
app.widget.protection.client-key-salt=${APP_WIDGET_CLIENT_KEY_SALT:local-widget-client-key-salt-change-before-production}
app.widget.protection.trust-forwarded-headers=${APP_WIDGET_TRUST_FORWARDED_HEADERS:false}
# Keep this empty unless the backend is reached only through a proxy that
# overwrites X-Forwarded-For. When header trust is enabled, only these proxy
# source CIDRs may supply a visitor address.
app.widget.protection.trusted-proxy-cidrs=${APP_WIDGET_TRUSTED_PROXY_CIDRS:}
app.widget.protection.session-ttl=${APP_WIDGET_SESSION_TTL:30m}
app.widget.protection.rate-limit-window=${APP_WIDGET_RATE_LIMIT_WINDOW:1m}
app.widget.protection.max-session-creations-per-window=${APP_WIDGET_MAX_SESSION_CREATIONS:10}
app.widget.protection.max-messages-per-window-per-client=${APP_WIDGET_MAX_MESSAGES_PER_CLIENT:30}
app.widget.protection.max-messages-per-window-per-session=${APP_WIDGET_MAX_MESSAGES_PER_SESSION:12}
app.widget.protection.max-messages-per-session=${APP_WIDGET_MAX_MESSAGES_PER_SESSION_TOTAL:120}
app.widget.protection.duplicate-replay-limit=${APP_WIDGET_DUPLICATE_REPLAY_LIMIT:2}
app.widget.protection.duplicate-window=${APP_WIDGET_DUPLICATE_WINDOW:2m}
app.widget.protection.request-lock-ttl=${APP_WIDGET_REQUEST_LOCK_TTL:60s}

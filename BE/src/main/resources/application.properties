server.port=${SERVER_PORT:8080}
server.shutdown=graceful

app.auth.public-registration-enabled=${APP_PUBLIC_REGISTRATION_ENABLED:false}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@blueai.local}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:BlueAiAdmin123!}
app.bootstrap-admin.full-name=${APP_BOOTSTRAP_ADMIN_FULL_NAME:BlueAI Administrator}

spring.application.name=blueai-auth-api
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blueai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Qu@ngminh80}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.redis.repositories.enabled=false

# Schema is owned by Flyway. Keep automatic baselining disabled: an existing
# database must be backed up, checked against V1, and explicitly baselined by
# an operator before the application is started against it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial entity schema baseline
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.placeholders.text_type=LONGTEXT
spring.flyway.placeholders.long_text_type=LONGTEXT

spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.access=read-only
management.prometheus.metrics.export.enabled=${PROMETHEUS_ENABLED:true}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.structured.format.console=${LOG_FORMAT:ecs}
# Do not probe Redis when local widget protection is configured to use the
# in-process fallback. Compose/production enables both through the same flag.
management.health.redis.enabled=${APP_WIDGET_REDIS_ENABLED:false}

app.jwt.issuer=${APP_JWT_ISSUER:blueai-auth}
app.jwt.audience=${APP_JWT_AUDIENCE:blueai-api}
app.jwt.secret=${APP_JWT_SECRET:ZGV2LW9ubHktYmx1ZWFpLWp3dC1zZWNyZXQtbXVzdC1iZS1yZXBsYWNlZCE=}
app.jwt.access-token-ttl=${APP_JWT_ACCESS_TTL:15m}
app.jwt.refresh-token-ttl=${APP_JWT_REFRESH_TTL:30d}

# Password-reset mail contract for the auth module. These names match
# PasswordResetProperties/PasswordResetDeliveryConfiguration. Reset is disabled
# by default outside the explicit prod profile; production must set
# APP_RESET_ENABLED=true together with SMTP_HOST and APP_RESET_MAIL_FROM.
# Reset tokens must never be written to logs.
app.auth.password-reset.enabled=${APP_RESET_ENABLED:false}
app.auth.password-reset.token-ttl=${APP_RESET_TOKEN_TTL:30m}
app.auth.password-reset.frontend-url=${APP_RESET_FRONTEND_URL:http://localhost:3000/reset-password}
app.auth.password-reset.mail-from=${APP_RESET_MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.test-connection=${SMTP_TEST_CONNECTION:false}

# Shared retry/retention knobs for modules that bind them later. Retention
# stays disabled until a module explicitly owns and verifies its cleanup job.
app.retry.max-attempts=${APP_RETRY_MAX_ATTEMPTS:3}
app.retry.initial-delay=${APP_RETRY_INITIAL_DELAY:250ms}
app.retry.max-delay=${APP_RETRY_MAX_DELAY:2s}
app.retention.enabled=${APP_RETENTION_ENABLED:false}
app.retention.cleanup-interval=${APP_RETENTION_CLEANUP_INTERVAL:1h}
app.retention.conversation=${APP_RETENTION_CONVERSATION:365d}
# Document tombstone retention is owned by app.documents.retention below.
app.auth.retention.scheduled-enabled=${APP_AUTH_RETENTION_SCHEDULED_ENABLED:false}
app.auth.retention.retention-days=${APP_AUTH_RETENTION_RETENTION_DAYS:90}
app.auth.retention.interval=${APP_AUTH_RETENTION_INTERVAL:24h}
app.auth.retention.initial-delay=${APP_AUTH_RETENTION_INITIAL_DELAY:24h}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.widget-allowed-origins=${APP_WIDGET_ALLOWED_ORIGINS:*}
app.documents.storage-dir=${APP_DOCUMENT_STORAGE_DIR:./storage/documents}
app.documents.max-size-bytes=${APP_DOCUMENT_MAX_SIZE_BYTES:20971520}
app.documents.processing-timeout=${APP_DOCUMENT_PROCESSING_TIMEOUT:10m}
app.documents.processing-max-attempts=${APP_DOCUMENT_PROCESSING_MAX_ATTEMPTS:3}
app.documents.processing-retry-base-delay=${APP_DOCUMENT_PROCESSING_RETRY_BASE_DELAY:30s}
app.documents.retention=${APP_DOCUMENT_RETENTION:30d}
app.worker.api-key=${APP_WORKER_API_KEY:local-worker-api-key-change-before-production}
app.rag.retrieval-base-url=${APP_RAG_RETRIEVAL_BASE_URL:http://127.0.0.1:8000}
app.rag.retrieval-search-path=${APP_RAG_RETRIEVAL_SEARCH_PATH:/v1/retrieval/search}
app.rag.llm-base-url=${APP_LLM_BASE_URL:http://127.0.0.1:8000}
app.rag.llm-chat-path=${APP_LLM_CHAT_PATH:/v1/chat/completions}
app.rag.llm-api-key=${APP_LLM_API_KEY:internal-rag-service}
app.rag.llm-model=${APP_LLM_MODEL:gemini-3.5-flash-lite}
app.rag.llm-max-attempts=${APP_LLM_MAX_ATTEMPTS:3}
app.rag.llm-retry-initial-delay=${APP_LLM_RETRY_INITIAL_DELAY:250ms}
app.rag.llm-retry-max-delay=${APP_LLM_RETRY_MAX_DELAY:2s}
app.rag.allow-shared-demo-knowledge=${APP_RAG_ALLOW_SHARED_DEMO_KNOWLEDGE:false}
# Bounded cross-conversation context for the authenticated internal Sales UI.
# Values are characters rather than provider-specific tokens, so deployments
# can switch compatible LLM providers without changing the guardrail.
app.rag.context.max-recent-messages=${APP_RAG_CONTEXT_MAX_RECENT_MESSAGES:20}
app.rag.context.history-characters=${APP_RAG_CONTEXT_HISTORY_CHARACTERS:6500}
app.rag.context.summary-characters=${APP_RAG_CONTEXT_SUMMARY_CHARACTERS:3000}
app.rag.context.memory-characters=${APP_RAG_CONTEXT_MEMORY_CHARACTERS:2000}
app.rag.context.linked-conversation-characters=${APP_RAG_CONTEXT_LINKED_CHARACTERS:5000}
app.rag.context.related-history-characters=${APP_RAG_CONTEXT_RELATED_HISTORY_CHARACTERS:3000}
app.rag.context.snapshot-message-count=${APP_RAG_CONTEXT_SNAPSHOT_MESSAGE_COUNT:10}
app.rag.context.snapshot-message-characters=${APP_RAG_CONTEXT_SNAPSHOT_MESSAGE_CHARACTERS:750}
app.rag.context.automatic-history-limit=${APP_RAG_CONTEXT_AUTOMATIC_HISTORY_LIMIT:2}
app.rag.context.minimum-relevance-score=${APP_RAG_CONTEXT_MIN_RELEVANCE_SCORE:0.2}
app.rag.context.summary-batch-size=${APP_RAG_CONTEXT_SUMMARY_BATCH_SIZE:10}
app.widget.cleanup-interval=${APP_WIDGET_CLEANUP_INTERVAL:15m}

# Public-widget abuse protection. Redis is enabled by Compose and provides the
# shared state required when the API runs on more than one instance. Keep it
# disabled only when running the backend locally without Redis.
app.widget.protection.redis-enabled=${APP_WIDGET_REDIS_ENABLED:false}
app.widget.protection.redis-key-prefix=${APP_WIDGET_REDIS_KEY_PREFIX:blueai:widget:}
app.widget.protection.client-key-salt=${APP_WIDGET_CLIENT_KEY_SALT:local-widget-client-key-salt-change-before-production}
app.widget.protection.trust-forwarded-headers=${APP_WIDGET_TRUST_FORWARDED_HEADERS:false}
# Keep this empty unless the backend is reached only through a proxy that
# overwrites X-Forwarded-For. When header trust is enabled, only these proxy
# source CIDRs may supply a visitor address.
app.widget.protection.trusted-proxy-cidrs=${APP_WIDGET_TRUSTED_PROXY_CIDRS:}
app.widget.protection.session-ttl=${APP_WIDGET_SESSION_TTL:30m}
app.widget.protection.rate-limit-window=${APP_WIDGET_RATE_LIMIT_WINDOW:1m}
app.widget.protection.max-session-creations-per-window=${APP_WIDGET_MAX_SESSION_CREATIONS:10}
app.widget.protection.max-messages-per-window-per-client=${APP_WIDGET_MAX_MESSAGES_PER_CLIENT:30}
app.widget.protection.max-messages-per-window-per-session=${APP_WIDGET_MAX_MESSAGES_PER_SESSION:12}
app.widget.protection.max-messages-per-session=${APP_WIDGET_MAX_MESSAGES_PER_SESSION_TOTAL:120}
app.widget.protection.duplicate-replay-limit=${APP_WIDGET_DUPLICATE_REPLAY_LIMIT:2}
app.widget.protection.duplicate-window=${APP_WIDGET_DUPLICATE_WINDOW:2m}
app.widget.protection.request-lock-ttl=${APP_WIDGET_REQUEST_LOCK_TTL:60s}

# Use together with compose.yaml only for a real deployment:
# docker compose -f compose.yaml -f compose.production.yaml up -d --build
#
# This override intentionally removes every host port except the frontend.
# Put TLS/CDN/WAF in front of port 80, or change the frontend binding to a
# loopback/private address for an external reverse proxy.
services:
  rag-ai:
    ports: !override []
    environment:
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:?Set GOOGLE_API_KEY in the deployment environment}"
      JAVA_WORKER_API_KEY: "${APP_WORKER_API_KEY:?Set APP_WORKER_API_KEY in the deployment environment}"

  mysql:
    ports: !override []
    environment:
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the deployment environment}"

  auth-api:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}"
      APP_JWT_SECRET: "${APP_JWT_SECRET:?Set APP_JWT_SECRET in the deployment environment}"
      APP_JWT_ISSUER: "${APP_JWT_ISSUER:-blueai-auth}"
      APP_JWT_AUDIENCE: "${APP_JWT_AUDIENCE:-blueai-api}"
      APP_PUBLIC_REGISTRATION_ENABLED: "false"
      # Set both on the first deployment to create the initial admin. Set both
      # explicitly blank on later deployments to disable bootstrap creation.
      APP_BOOTSTRAP_ADMIN_EMAIL: "${APP_BOOTSTRAP_ADMIN_EMAIL-}"
      APP_BOOTSTRAP_ADMIN_PASSWORD: "${APP_BOOTSTRAP_ADMIN_PASSWORD-}"
      APP_BOOTSTRAP_ADMIN_FULL_NAME: "${APP_BOOTSTRAP_ADMIN_FULL_NAME:-BlueAI Administrator}"
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:?Set APP_CORS_ALLOWED_ORIGINS to the admin UI origin}"
      APP_WIDGET_ALLOWED_ORIGINS: "${APP_WIDGET_ALLOWED_ORIGINS:?Set APP_WIDGET_ALLOWED_ORIGINS to widget host origins}"
      # Password reset is required by the production startup validator. Keep
      # SMTP credentials in the ignored deployment .env, never in this file.
      APP_RESET_ENABLED: "${APP_RESET_ENABLED:?Set APP_RESET_ENABLED=true}"
      APP_RESET_TOKEN_TTL: "${APP_RESET_TOKEN_TTL:-30m}"
      APP_RESET_FRONTEND_URL: "${APP_RESET_FRONTEND_URL:?Set APP_RESET_FRONTEND_URL to the HTTPS reset page}"
      APP_RESET_MAIL_FROM: "${APP_RESET_MAIL_FROM:?Set APP_RESET_MAIL_FROM to the verified sender address}"
      SMTP_HOST: "${SMTP_HOST:?Set SMTP_HOST to the mail relay}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_AUTH: "${SMTP_AUTH:-true}"
      SMTP_STARTTLS_ENABLE: "${SMTP_STARTTLS_ENABLE:-true}"
      SMTP_STARTTLS_REQUIRED: "${SMTP_STARTTLS_REQUIRED:-true}"
      SMTP_TEST_CONNECTION: "${SMTP_TEST_CONNECTION:-false}"
      # Retention is disabled unless explicitly opted in. User soft-delete
      # tombstones are never removed by these jobs.
      APP_RETENTION_ENABLED: "${APP_RETENTION_ENABLED:-false}"
      APP_RETENTION_CLEANUP_INTERVAL: "${APP_RETENTION_CLEANUP_INTERVAL:-1h}"
      APP_RETENTION_CONVERSATION: "${APP_RETENTION_CONVERSATION:-365d}"
      APP_DOCUMENT_RETENTION: "${APP_DOCUMENT_RETENTION:-30d}"
      APP_AUTH_RETENTION_SCHEDULED_ENABLED: "${APP_AUTH_RETENTION_SCHEDULED_ENABLED:-false}"
      APP_AUTH_RETENTION_RETENTION_DAYS: "${APP_AUTH_RETENTION_RETENTION_DAYS:-90}"
      APP_AUTH_RETENTION_INTERVAL: "${APP_AUTH_RETENTION_INTERVAL:-24h}"
      APP_AUTH_RETENTION_INITIAL_DELAY: "${APP_AUTH_RETENTION_INITIAL_DELAY:-24h}"
      APP_WIDGET_REDIS_ENABLED: "true"
      APP_WIDGET_CLIENT_KEY_SALT: "${APP_WIDGET_CLIENT_KEY_SALT:?Set APP_WIDGET_CLIENT_KEY_SALT in the deployment environment}"
      APP_WIDGET_TRUST_FORWARDED_HEADERS: "true"
      APP_WIDGET_TRUSTED_PROXY_CIDRS: "${APP_WIDGET_TRUSTED_PROXY_CIDRS:?Set APP_WIDGET_TRUSTED_PROXY_CIDRS to only the trusted proxy CIDR}"
      APP_RAG_ALLOW_SHARED_DEMO_KNOWLEDGE: "false"
      APP_WORKER_API_KEY: "${APP_WORKER_API_KEY:?Set APP_WORKER_API_KEY in the deployment environment}"
    networks:
      - default
      # Private scrape path; auth-agent must permit only /actuator/prometheus
      # on this network. FE/public ingress never joins this network.
      - monitoring

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - blueai-prometheus-data:/prometheus
    networks:
      - monitoring
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    secrets:
      - alertmanager_webhook_url
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - blueai-alertmanager-data:/alertmanager
    networks:
      - monitoring
      # Egress-only path for the configured incident/ChatOps webhook. No host
      # port is published; Prometheus/Loki remain on the internal network.
      - default
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./ops/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - blueai-loki-data:/loki
    networks:
      - monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.2
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./ops/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks:
      - monitoring
    restart: unless-stopped

  frontend:
    ports: !override
      - "80:80"

volumes:
  blueai-prometheus-data:
  blueai-alertmanager-data:
  blueai-loki-data:

secrets:
  alertmanager_webhook_url:
    environment: ALERTMANAGER_WEBHOOK_URL

networks:
  monitoring:
    internal: true

# Use together with compose.yaml only for a real deployment:
# docker compose -f compose.yaml -f compose.production.yaml up -d --build
#
# This override intentionally removes every host port except the frontend.
# Put TLS/CDN/WAF in front of port 80, or change the frontend binding to a
# loopback/private address for an external reverse proxy.
services:
  rag-ai:
    ports: !override []
    environment:
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:?Set GOOGLE_API_KEY in the deployment environment}"
      JAVA_WORKER_API_KEY: "${APP_WORKER_API_KEY:?Set APP_WORKER_API_KEY in the deployment environment}"

  mysql:
    ports: !override []
    environment:
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the deployment environment}"

  auth-api:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}"
      APP_JWT_SECRET: "${APP_JWT_SECRET:?Set APP_JWT_SECRET in the deployment environment}"
      APP_JWT_ISSUER: "${APP_JWT_ISSUER:-blueai-auth}"
      APP_JWT_AUDIENCE: "${APP_JWT_AUDIENCE:-blueai-api}"
      APP_PUBLIC_REGISTRATION_ENABLED: "false"
      # Set both on the first deployment to create the initial admin. Set both
      # explicitly blank on later deployments to disable bootstrap creation.
      APP_BOOTSTRAP_ADMIN_EMAIL: "${APP_BOOTSTRAP_ADMIN_EMAIL-}"
      APP_BOOTSTRAP_ADMIN_PASSWORD: "${APP_BOOTSTRAP_ADMIN_PASSWORD-}"
      APP_BOOTSTRAP_ADMIN_FULL_NAME: "${APP_BOOTSTRAP_ADMIN_FULL_NAME:-BlueAI Administrator}"
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:?Set APP_CORS_ALLOWED_ORIGINS to the admin UI origin}"
      APP_WIDGET_ALLOWED_ORIGINS: "${APP_WIDGET_ALLOWED_ORIGINS:?Set APP_WIDGET_ALLOWED_ORIGINS to widget host origins}"
      APP_WIDGET_REDIS_ENABLED: "true"
      APP_WIDGET_CLIENT_KEY_SALT: "${APP_WIDGET_CLIENT_KEY_SALT:?Set APP_WIDGET_CLIENT_KEY_SALT in the deployment environment}"
      APP_WIDGET_TRUST_FORWARDED_HEADERS: "true"
      APP_WIDGET_TRUSTED_PROXY_CIDRS: "${APP_WIDGET_TRUSTED_PROXY_CIDRS:?Set APP_WIDGET_TRUSTED_PROXY_CIDRS to only the trusted proxy CIDR}"
      APP_RAG_ALLOW_SHARED_DEMO_KNOWLEDGE: "false"
      APP_WORKER_API_KEY: "${APP_WORKER_API_KEY:?Set APP_WORKER_API_KEY in the deployment environment}"

  frontend:
    ports: !override
      - "80:80"

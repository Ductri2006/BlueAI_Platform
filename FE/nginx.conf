# This file is included from nginx.conf's http block by the official image.
# OPTIONS has no key so browser CORS preflights do not consume a visitor's
# request budget; the backend remains responsible for validating the origin.
map $request_method $widget_rate_limit_key {
    default $binary_remote_addr;
    OPTIONS "";
}

map $request_method $login_rate_limit_key {
    default $binary_remote_addr;
    OPTIONS "";
}

# Edge limits intentionally sit above the application limits. They shed a
# connection/CPU flood before Java, while Redis remains the precise shared
# quota authority for accepted widget requests.
limit_req_zone $widget_rate_limit_key zone=widget_session_requests:10m rate=20r/m;
limit_req_zone $widget_rate_limit_key zone=widget_message_requests:10m rate=90r/m;
limit_conn_zone $binary_remote_addr zone=widget_connections:10m;
limit_req_zone $login_rate_limit_key zone=login_requests:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Retrieval plus bounded Java completion retries may exceed nginx's 60s
    # default. Do not cut off a request while the backend is still answering.
    proxy_read_timeout 150s;
    client_max_body_size 1m;

    # A 20 MB file plus multipart overhead must fit the backend's 21 MB
    # request limit. Other API routes keep the smaller default limit.
    location = /api/v1/documents {
        client_max_body_size 21m;
        proxy_pass http://auth-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/login {
        limit_req zone=login_requests burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_rate_limited;
        proxy_pass http://auth-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @login_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"code":"RATE_LIMIT_EXCEEDED","message":"Too many login attempts. Try again later."}';
    }

    # The only intentionally public backend paths. Keep the endpoint-specific
    # locations above the general /api/ proxy so Nginx can shed abusive bursts
    # before they occupy Java/Redis/LLM resources.
    location ~ ^/api/v1/widget/[^/]+/sessions$ {
        limit_req zone=widget_session_requests burst=10 nodelay;
        limit_conn widget_connections 10;
        limit_req_status 429;
        proxy_pass http://auth-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, do not append: a browser must not be able to smuggle a
        # forged X-Forwarded-For value through this trusted proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/runtime/sessions/[^/]+/messages$ {
        limit_req zone=widget_message_requests burst=20 nodelay;
        limit_conn widget_connections 10;
        limit_req_status 429;
        proxy_pass http://auth-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Management endpoints stay reachable only on the private auth-api
    # network. The application also requires an ADMIN role as defence in depth.
    location = /actuator {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    # Only the Python worker on the private Compose network may call Java's
    # internal API. Never forward these paths through the public frontend.
    location = /api/v1/internal {
        return 404;
    }

    location ^~ /api/v1/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://auth-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

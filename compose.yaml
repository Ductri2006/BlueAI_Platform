name: blueai-auth

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: blueai_auth
      MYSQL_USER: blueai
      MYSQL_PASSWORD: ${DB_PASSWORD:-blueai-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-blueai-root-local}
    ports:
      - "33069:3306"
    volumes:
      - blueai-auth-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-blueai-root-local}"]
      interval: 3s
      timeout: 5s
      retries: 30

  auth-api:
    build:
      context: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/blueai_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: blueai
      DB_PASSWORD: ${DB_PASSWORD:-blueai-local}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-ZGV2LW9ubHktYmx1ZWFpLWp3dC1zZWNyZXQtbXVzdC1iZS1yZXBsYWNlZCE=}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-blueai-auth}
      APP_JWT_AUDIENCE: ${APP_JWT_AUDIENCE:-blueai-api}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  blueai-auth-mysql:

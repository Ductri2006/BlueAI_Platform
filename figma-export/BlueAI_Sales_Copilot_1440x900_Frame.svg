<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_canvas_sp" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060B14"/>
      <stop offset="100%" stop-color="#0B1324"/>
    </linearGradient>
    <linearGradient id="brand_grad_sp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E4FD8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1440" height="900" fill="url(#bg_canvas_sp)"/>

  <!-- 1. LEFT SIDEBAR (240px) -->
  <g id="Sidebar">
    <rect width="240" height="900" fill="#070D18" stroke="#182744" stroke-width="1"/>
    <!-- Logo -->
    <rect x="18" y="14" width="28" height="28" rx="8" fill="url(#brand_grad_sp)"/>
    <text x="32" y="33" font-family="Be Vietnam Pro, sans-serif" font-weight="900" font-size="15" fill="white" text-anchor="middle">b</text>
    <text x="54" y="32" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="15" fill="#F8FAFC">blueAI</text>
    
    <!-- Nav Items -->
    <rect x="12" y="90" width="216" height="38" rx="10" fill="transparent"/>
    <text x="44" y="114" font-family="Be Vietnam Pro, sans-serif" font-weight="600" font-size="12.5" fill="#94A3B8">Hỏi BlueAI</text>

    <!-- Active: Sales Copilot -->
    <rect x="12" y="132" width="216" height="38" rx="10" fill="#1E4FD8"/>
    <text x="44" y="156" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="12.5" fill="white">Trợ lý Bán hàng &amp; CSKH</text>

    <rect x="12" y="174" width="216" height="38" rx="10" fill="transparent"/>
    <text x="44" y="198" font-family="Be Vietnam Pro, sans-serif" font-weight="600" font-size="12.5" fill="#94A3B8">Tài liệu &amp; Tri thức RAG</text>

    <rect x="12" y="216" width="216" height="38" rx="10" fill="transparent"/>
    <text x="44" y="240" font-family="Be Vietnam Pro, sans-serif" font-weight="600" font-size="12.5" fill="#94A3B8">Quản trị Hệ thống</text>
  </g>

  <!-- 2. TOP BAR (1200px) -->
  <g id="TopBar">
    <rect x="240" y="0" width="1200" height="56" fill="#070E1C" stroke="#182744" stroke-width="1"/>
    <circle cx="264" cy="28" r="4" fill="#10B981"/>
    <text x="278" y="32" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="13" fill="#F8FAFC">Bluecom Enterprise Core | Không gian Sales &amp; CSKH Copilot</text>
    
    <rect x="1170" y="12" width="210" height="32" rx="10" fill="#0E1A33" stroke="#2563EB" stroke-width="1"/>
    <text x="1275" y="32" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="11.5" fill="#38BDF8" text-anchor="middle">Vai trò: 2. Sales Copilot</text>
  </g>

  <!-- 3. COLUMN 1: QUEUE LIST (300px) -->
  <g id="Col_Queue" transform="translate(240, 56)">
    <rect width="300" height="844" fill="#08101E" stroke="#182744" stroke-width="1"/>
    <!-- Header -->
    <rect width="300" height="48" fill="#0B1528" stroke="#182744" stroke-width="1"/>
    <text x="16" y="29" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="13" fill="#F8FAFC">Hàng chờ xử lý</text>
    <rect x="220" y="14" width="64" height="20" rx="10" fill="#0E2244" stroke="#2563EB" stroke-width="0.8"/>
    <text x="252" y="28" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="10.5" fill="#38BDF8" text-anchor="middle">3 khách</text>

    <!-- Queue Card 1 (Active) -->
    <g transform="translate(12, 60)">
      <rect width="276" height="96" rx="14" fill="#0E1F3D" stroke="#38BDF8" stroke-width="1"/>
      <rect x="12" y="12" width="24" height="24" rx="6" fill="url(#brand_grad_sp)"/>
      <text x="24" y="28" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="11" fill="white" text-anchor="middle">N</text>
      <text x="44" y="28" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="12.5" fill="#F8FAFC">Nguyễn Hoàng Nam</text>
      <rect x="216" y="12" width="48" height="18" rx="6" fill="#7F1D1D"/>
      <text x="240" y="24" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="9.5" fill="#FCA5A5" text-anchor="middle">2 phút</text>
      
      <text x="12" y="54" font-family="Be Vietnam Pro, sans-serif" font-size="11" fill="#94A3B8">Mình vừa hạ cánh Narita chưa có sóng 5G...</text>
      <line x1="12" y1="72" x2="264" y2="72" stroke="#182744"/>
      <text x="12" y="86" font-family="Be Vietnam Pro, sans-serif" font-size="10" fill="#64748B">Kênh: <tspan fill="#F8FAFC">Zalo</tspan></text>
      <text x="226" y="86" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="10" fill="#38BDF8">Diamond</text>
    </g>

    <!-- Queue Card 2 -->
    <g transform="translate(12, 166)">
      <rect width="276" height="96" rx="14" fill="#0B1324" stroke="#182744" stroke-width="1"/>
      <rect x="12" y="12" width="24" height="24" rx="6" fill="#1E3A8A"/>
      <text x="24" y="28" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="11" fill="#93C5FD" text-anchor="middle">M</text>
      <text x="44" y="28" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="12.5" fill="#F8FAFC">Trần Thị Mai Phương</text>
      
      <text x="12" y="54" font-family="Be Vietnam Pro, sans-serif" font-size="11" fill="#94A3B8">Mã QR này gửi cho bạn chị quét được không?</text>
      <line x1="12" y1="72" x2="264" y2="72" stroke="#182744"/>
      <text x="12" y="86" font-family="Be Vietnam Pro, sans-serif" font-size="10" fill="#64748B">Kênh: <tspan fill="#F8FAFC">Website</tspan></text>
      <text x="246" y="86" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="10" fill="#F59E0B">Gold</text>
    </g>
  </g>

  <!-- 4. COLUMN 2: LIVE CONVERSATION (540px) -->
  <g id="Col_Chat" transform="translate(540, 56)">
    <rect width="540" height="844" fill="#070D18" stroke="#182744" stroke-width="1"/>
    
    <!-- Chat Header -->
    <rect width="540" height="52" fill="#0A1324" stroke="#182744" stroke-width="1"/>
    <rect x="16" y="10" width="32" height="32" rx="8" fill="url(#brand_grad_sp)"/>
    <text x="32" y="31" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="14" fill="white" text-anchor="middle">N</text>
    <text x="56" y="26" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="13.5" fill="#F8FAFC">Nguyễn Hoàng Nam</text>
    <rect x="188" y="14" width="60" height="16" rx="8" fill="#142340" stroke="#2563EB" stroke-width="0.8"/>
    <text x="218" y="26" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="9.5" fill="#38BDF8" text-anchor="middle">Diamond</text>
    <text x="56" y="38" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748B">0908•••129 • eSIM Nhật Bản (SoftBank)</text>

    <!-- HITL Button -->
    <rect x="380" y="12" width="144" height="28" rx="8" fill="#451A03" stroke="#F59E0B" stroke-width="0.8"/>
    <text x="452" y="29" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="10.5" fill="#FBBF24" text-anchor="middle">⚠ Yêu cầu hoàn tiền (HITL)</text>

    <!-- Messages -->
    <!-- Customer msg -->
    <g transform="translate(20, 70)">
      <rect width="400" height="60" rx="16" fill="#111C33" stroke="#182744" stroke-width="1"/>
      <text x="16" y="28" font-family="Be Vietnam Pro, sans-serif" font-size="13" fill="#F8FAFC">Chào shop, mình vừa hạ cánh sân bay Narita nhưng bật</text>
      <text x="16" y="46" font-family="Be Vietnam Pro, sans-serif" font-size="13" fill="#F8FAFC">mạng chưa thấy có sóng 5G, shop hỗ trợ gấp với!</text>
      <text x="350" y="48" font-family="Be Vietnam Pro, sans-serif" font-size="10" fill="#64748B">14:32</text>
    </g>

    <!-- Agent Composer at Bottom -->
    <g transform="translate(16, 680)">
      <rect width="508" height="144" rx="16" fill="#0B1324" stroke="#2563EB" stroke-width="1"/>
      <text x="16" y="32" font-family="Be Vietnam Pro, sans-serif" font-size="13" fill="#64748B">Nhập nội dung phản hồi hoặc chèn từ gợi ý BlueAI Copilot...</text>
      
      <line x1="12" y1="96" x2="496" y2="96" stroke="#182744"/>
      <text x="16" y="122" font-family="Be Vietnam Pro, sans-serif" font-size="11" fill="#64748B">Kênh gửi: <tspan fill="#F8FAFC" font-weight="700">Zalo Official Account</tspan></text>
      
      <rect x="390" y="104" width="106" height="30" rx="8" fill="url(#brand_grad_sp)"/>
      <text x="443" y="123" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="11.5" fill="white" text-anchor="middle">Gửi phản hồi</text>
    </g>
  </g>

  <!-- 5. COLUMN 3: BLUEAI COPILOT & CUSTOMER 360 (360px) -->
  <g id="Col_Copilot" transform="translate(1080, 56)">
    <rect width="360" height="844" fill="#0A1324" stroke="#182744" stroke-width="1"/>
    
    <!-- Tab Bar -->
    <rect width="360" height="48" fill="#0B1528" stroke="#182744" stroke-width="1"/>
    <rect x="12" y="8" width="106" height="32" rx="8" fill="#1E4FD8"/>
    <text x="65" y="28" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="11.5" fill="white" text-anchor="middle">✨ Gợi ý BlueAI</text>

    <text x="175" y="28" font-family="Be Vietnam Pro, sans-serif" font-weight="600" font-size="11.5" fill="#94A3B8" text-anchor="middle">Customer 360</text>
    <text x="290" y="28" font-family="Be Vietnam Pro, sans-serif" font-weight="600" font-size="11.5" fill="#94A3B8" text-anchor="middle">So sánh gói</text>

    <!-- Context Banner -->
    <g transform="translate(16, 64)">
      <rect width="328" height="54" rx="12" fill="#0E2244" stroke="#2563EB" stroke-width="0.8"/>
      <text x="12" y="22" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="11" fill="#38BDF8">⚡ Ngữ cảnh: Sự cố sóng sân bay Narita</text>
      <text x="12" y="40" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" fill="#94A3B8">Đối chiếu DOC-TECH-108 &amp; đơn hàng ORD-JP-98214</text>
    </g>

    <!-- Grounded Answer Card -->
    <g transform="translate(16, 130)">
      <rect width="328" height="280" rx="16" fill="#0E1A33" stroke="#182744" stroke-width="1"/>
      <text x="16" y="28" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="12.5" fill="#F8FAFC">Câu trả lời đề xuất (Grounded)</text>
      <circle cx="280" cy="24" r="3.5" fill="#10B981"/>
      <text x="290" y="28" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="10" fill="#10B981">Đã xác thực</text>

      <rect x="12" y="42" width="304" height="150" rx="10" fill="#060B14" stroke="#182744" stroke-width="1"/>
      <text x="20" y="64" font-family="Be Vietnam Pro, sans-serif" font-size="11" fill="#E2E8F0">Dạ em chào anh Nam, Bluecom đã kiểm</text>
      <text x="20" y="82" font-family="Be Vietnam Pro, sans-serif" font-size="11" fill="#E2E8F0">tra mã eSIM #ORD-JP-98214 của anh.</text>
      <text x="20" y="108" font-family="Be Vietnam Pro, sans-serif" font-size="11" fill="#38BDF8">1. Cài đặt → Di động → Bật Data Roaming.</text>
      <text x="20" y="128" font-family="Be Vietnam Pro, sans-serif" font-size="11" fill="#38BDF8">2. Khởi động lại máy nhận APN vmobile.jp.</text>
      <text x="20" y="152" font-family="Be Vietnam Pro, sans-serif" font-size="11" fill="#E2E8F0">Em đang giữ kết nối hỗ trợ anh ngay ạ!</text>

      <!-- Action Button -->
      <rect x="12" y="202" width="304" height="34" rx="8" fill="#1E4FD8"/>
      <text x="164" y="223" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="11.5" fill="white" text-anchor="middle">↵ Chèn vào ô trả lời</text>
      
      <text x="16" y="260" font-family="Be Vietnam Pro, sans-serif" font-size="10" fill="#38BDF8">Căn cứ: [DOC-TECH-108]</text>
    </g>

    <!-- Quick Objections -->
    <g transform="translate(16, 426)">
      <text x="0" y="16" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="10.5" fill="#64748B" letter-spacing="0.5">MẪU XỬ LÝ NHANH</text>
      
      <rect y="28" width="328" height="36" rx="8" fill="#0E1A33" stroke="#182744" stroke-width="1"/>
      <text x="12" y="50" font-family="Be Vietnam Pro, sans-serif" font-size="11" fill="#E2E8F0">Hướng dẫn bật Roaming trên iOS &amp; Android</text>

      <rect y="72" width="328" height="36" rx="8" fill="#0E1A33" stroke="#182744" stroke-width="1"/>
      <text x="12" y="94" font-family="Be Vietnam Pro, sans-serif" font-size="11" fill="#E2E8F0">Chính sách hoàn tiền 100% khi lỗi trạm</text>
    </g>
  </g>
</svg>

<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg_canvas" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060B14"/>
      <stop offset="100%" stop-color="#0B1324"/>
    </linearGradient>
    <linearGradient id="brand_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E4FD8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="card_grad_1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1A33"/>
      <stop offset="100%" stop-color="#08101E"/>
    </linearGradient>
    <linearGradient id="card_border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B4675"/>
      <stop offset="100%" stop-color="#142340"/>
    </linearGradient>
    <filter id="glow_orb" x="600" y="80" width="300" height="300" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="url(#bg_canvas)"/>

  <!-- Subtle Grid lines -->
  <g opacity="0.15" stroke="#2563EB" stroke-width="0.5">
    <line x1="256" y1="0" x2="256" y2="900"/>
    <line x1="0" y1="56" x2="1440" y2="56"/>
    <line x1="0" y1="104" x2="1440" y2="104"/>
  </g>

  <!-- 1. LEFT NAVIGATION RAIL (256px) -->
  <g id="Sidebar_Rail">
    <rect width="256" height="900" fill="#070D18" stroke="#182744" stroke-width="1"/>
    
    <!-- Logo -->
    <rect x="20" y="14" width="30" height="30" rx="9" fill="url(#brand_grad)"/>
    <text x="35" y="34" font-family="Be Vietnam Pro, sans-serif" font-weight="900" font-size="16" fill="white" text-anchor="middle">b</text>
    <text x="58" y="33" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="16" fill="#F8FAFC">blueAI</text>
    <text x="58" y="44" font-family="Be Vietnam Pro, sans-serif" font-weight="500" font-size="10" fill="#64748B">Trí tuệ Vận hành Doanh nghiệp</text>

    <!-- Nav Category Title -->
    <text x="24" y="82" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="10.5" fill="#64748B" letter-spacing="1">KHÔNG GIAN LÀM VIỆC</text>

    <!-- Nav Items -->
    <!-- Active: Hỏi BlueAI -->
    <rect x="14" y="96" width="228" height="40" rx="12" fill="#1E4FD8"/>
    <circle cx="34" cy="116" r="6" fill="none" stroke="white" stroke-width="1.5"/>
    <text x="50" y="121" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="13" fill="white">Hỏi BlueAI</text>

    <!-- Item: Sales Copilot -->
    <rect x="14" y="142" width="228" height="38" rx="12" fill="transparent"/>
    <text x="50" y="166" font-family="Be Vietnam Pro, sans-serif" font-weight="600" font-size="13" fill="#94A3B8">Trợ lý Bán hàng &amp; CSKH</text>

    <!-- Item: Tri thức RAG -->
    <rect x="14" y="186" width="228" height="38" rx="12" fill="transparent"/>
    <text x="50" y="210" font-family="Be Vietnam Pro, sans-serif" font-weight="600" font-size="13" fill="#94A3B8">Tài liệu &amp; Tri thức RAG</text>

    <!-- Item: Admin -->
    <rect x="14" y="230" width="228" height="38" rx="12" fill="transparent"/>
    <text x="50" y="254" font-family="Be Vietnam Pro, sans-serif" font-weight="600" font-size="13" fill="#94A3B8">Quản trị Hệ thống</text>

    <!-- Item: Reseller -->
    <rect x="14" y="274" width="228" height="38" rx="12" fill="transparent"/>
    <text x="50" y="298" font-family="Be Vietnam Pro, sans-serif" font-weight="600" font-size="13" fill="#94A3B8">Cổng Đại lý Phân phối</text>

    <!-- Item: Customer Support -->
    <rect x="14" y="318" width="228" height="38" rx="12" fill="transparent"/>
    <text x="50" y="342" font-family="Be Vietnam Pro, sans-serif" font-weight="600" font-size="13" fill="#94A3B8">Trung tâm Hỗ trợ Khách hàng</text>

    <!-- Button: New Chat -->
    <rect x="14" y="380" width="228" height="36" rx="10" fill="url(#brand_grad)"/>
    <text x="128" y="403" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="12.5" fill="white" text-anchor="middle">+ Cuộc trò chuyện mới</text>

    <!-- Recent History Section -->
    <text x="24" y="445" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="10.5" fill="#64748B" letter-spacing="1">GẦN ĐÂY</text>
    <rect x="14" y="458" width="228" height="34" rx="10" fill="#0E1A33" stroke="#182744" stroke-width="1"/>
    <text x="34" y="479" font-family="Be Vietnam Pro, sans-serif" font-weight="600" font-size="12" fill="#F8FAFC">Quy định hoàn tiền eSIM</text>

    <rect x="14" y="498" width="228" height="34" rx="10" fill="transparent"/>
    <text x="34" y="519" font-family="Be Vietnam Pro, sans-serif" font-weight="500" font-size="12" fill="#94A3B8">So sánh mạng SoftBank vs Docomo</text>

    <!-- User Profile Footer -->
    <line x1="0" y1="840" x2="256" y2="840" stroke="#182744"/>
    <rect x="16" y="852" width="32" height="32" rx="10" fill="url(#brand_grad)"/>
    <text x="32" y="873" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="13" fill="white" text-anchor="middle">H</text>
    <text x="56" y="868" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="12" fill="#F8FAFC">Hà CSKH &amp; Sales</text>
    <text x="56" y="880" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748B">Bluecom Main • ID: 8812</text>
  </g>

  <!-- 2. TOP APP BAR (1184px) -->
  <g id="Top_Header">
    <rect x="256" y="0" width="1184" height="56" fill="#070E1C" fill-opacity="0.9" stroke="#182744" stroke-width="1"/>
    <circle cx="280" cy="28" r="4" fill="#10B981"/>
    <text x="294" y="32" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="13" fill="#F8FAFC">Bluecom Enterprise Core</text>
    <text x="460" y="32" font-family="Be Vietnam Pro, sans-serif" font-weight="500" font-size="12" fill="#64748B">|  Phạm vi: Toàn hệ thống (Nội bộ &amp; Đại lý)</text>

    <!-- Role Demo Pill -->
    <rect x="1100" y="12" width="220" height="32" rx="10" fill="#0E1A33" stroke="#2563EB" stroke-width="1"/>
    <circle cx="1116" cy="28" r="4" fill="#38BDF8"/>
    <text x="1128" y="32" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="11.5" fill="#38BDF8">Vai trò: 1. Hỏi BlueAI (Staff)</text>

    <!-- Theme button -->
    <rect x="1332" y="12" width="32" height="32" rx="10" fill="#0E1A33" stroke="#182744" stroke-width="1"/>
    <circle cx="1348" cy="28" r="6" fill="#F59E0B"/>

    <!-- Bell -->
    <rect x="1374" y="12" width="32" height="32" rx="10" fill="#0E1A33" stroke="#182744" stroke-width="1"/>
    <circle cx="1396" cy="22" r="3" fill="#38BDF8"/>
  </g>

  <!-- 3. SUB-HEADER -->
  <g id="Sub_Header">
    <rect x="256" y="56" width="1184" height="48" fill="#0A1324" stroke="#182744" stroke-width="1"/>
    <circle cx="280" cy="80" r="3" fill="#38BDF8"/>

  </g>

  <!-- 4. HERO SECTION WITH 3D QUANTUM CORE -->
  <g id="Hero_Stage">
    <!-- Ambient Glow Backdrop -->
    <circle cx="848" cy="220" r="80" fill="#1E4FD8" opacity="0.3" filter="url(#glow_orb)"/>
    <circle cx="848" cy="220" r="45" fill="#38BDF8" opacity="0.25"/>

    <!-- 3D Gyro Rings -->
    <ellipse cx="848" cy="220" rx="60" ry="24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 2" transform="rotate(-20 848 220)"/>
    <ellipse cx="848" cy="220" rx="68" ry="28" fill="none" stroke="#1E4FD8" stroke-width="1.5" transform="rotate(35 848 220)"/>
    
    <!-- Central Core -->
    <circle cx="848" cy="220" r="22" fill="#0EA5E9" opacity="0.4"/>
    <polygon points="848,205 862,220 848,235 834,220" fill="none" stroke="white" stroke-width="2"/>

    <!-- Badge Tag -->
    <rect x="718" y="300" width="260" height="28" rx="14" fill="#0B1528" stroke="#182744" stroke-width="1"/>
    <circle cx="734" cy="314" r="3" fill="#38BDF8"/>
    <text x="746" y="318" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="11" fill="#38BDF8">BlueAI Operational Intelligence v5.2</text>
    <circle cx="962" cy="314" r="2.5" fill="#10B981"/>

    <!-- Hero Heading -->
    <text x="848" y="356" font-family="Be Vietnam Pro, sans-serif" font-weight="900" font-size="24" fill="#F8FAFC" text-anchor="middle">Chào bạn, tôi có thể hỗ trợ gì cho ca làm việc hôm nay?</text>
    <text x="848" y="380" font-family="Be Vietnam Pro, sans-serif" font-weight="500" font-size="13" fill="#94A3B8" text-anchor="middle">BlueAI tự động kết nối và đối chiếu với kho quy chế, chính sách hoàn hủy, bảng giá và hệ thống OMS Core.</text>
  </g>

  <!-- 5. BENTO PROMPT CARDS (4 Cards Grid) -->
  <g id="Bento_Cards">
    <!-- Card 1: Hoàn tiền (Emerald) -->
    <g transform="translate(488, 410)">
      <rect width="340" height="110" rx="20" fill="url(#card_grad_1)" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="16" y="16" width="34" height="34" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
      <text x="33" y="38" font-family="Be Vietnam Pro, sans-serif" font-weight="900" font-size="16" fill="#10B981" text-anchor="middle">$</text>
      <text x="60" y="30" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="10" fill="#10B981" letter-spacing="0.5">CHÍNH SÁCH CSKH</text>
      <text x="16" y="74" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="14" fill="#F8FAFC">Hoàn tiền eSIM chưa kích hoạt</text>
      <text x="16" y="94" font-family="Be Vietnam Pro, sans-serif" font-weight="500" font-size="11.5" fill="#94A3B8">Quy định hủy đơn &amp; điều kiện ICCID Unused DOC-POL-042</text>
    </g>

    <!-- Card 2: So sánh Docomo vs Softbank (Cobalt) -->
    <g transform="translate(848, 410)">
      <rect width="340" height="110" rx="20" fill="url(#card_grad_1)" stroke="#2563EB" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="16" y="16" width="34" height="34" rx="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
      <text x="33" y="38" font-family="Be Vietnam Pro, sans-serif" font-weight="900" font-size="16" fill="#60A5FA" text-anchor="middle">⚖</text>
      <text x="60" y="30" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="10" fill="#60A5FA" letter-spacing="0.5">KỸ THUẬT TELCO</text>
      <text x="16" y="74" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="14" fill="#F8FAFC">So sánh gói mạng Nhật Bản</text>
      <text x="16" y="94" font-family="Be Vietnam Pro, sans-serif" font-weight="500" font-size="11.5" fill="#94A3B8">Docomo phủ sóng 99% vs SoftBank 5G tốc độ cao Tokyo</text>
    </g>

    <!-- Card 3: Cấu hình APN (Sky Cyan) -->
    <g transform="translate(488, 535)">
      <rect width="340" height="110" rx="20" fill="url(#card_grad_1)" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="16" y="16" width="34" height="34" rx="10" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
      <text x="33" y="38" font-family="Be Vietnam Pro, sans-serif" font-weight="900" font-size="16" fill="#38BDF8" text-anchor="middle">📶</text>
      <text x="60" y="30" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="10" fill="#38BDF8" letter-spacing="0.5">CÀI ĐẶT MẠNG</text>
      <text x="16" y="74" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="14" fill="#F8FAFC">Cấu hình APN vmobile.jp</text>
      <text x="16" y="94" font-family="Be Vietnam Pro, sans-serif" font-weight="500" font-size="11.5" fill="#94A3B8">Xử lý sự cố không lên sóng khi hạ cánh sân bay quốc tế</text>
    </g>

    <!-- Card 4: Chiết khấu Đại lý (Amber) -->
    <g transform="translate(848, 535)">
      <rect width="340" height="110" rx="20" fill="url(#card_grad_1)" stroke="#D97706" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="16" y="16" width="34" height="34" rx="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
      <text x="33" y="38" font-family="Be Vietnam Pro, sans-serif" font-weight="900" font-size="16" fill="#FBBF24" text-anchor="middle">💎</text>
      <text x="60" y="30" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="10" fill="#FBBF24" letter-spacing="0.5">KÊNH PHÂN PHỐI</text>
      <text x="16" y="74" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="14" fill="#F8FAFC">Hạn mức chiết khấu Đại lý</text>
      <text x="16" y="94" font-family="Be Vietnam Pro, sans-serif" font-weight="500" font-size="11.5" fill="#94A3B8">Chiết khấu cố định 24% Kim Cương, thưởng quý &amp; credit 50tr</text>
    </g>
  </g>

  <!-- 6. FLOATING COMPOSER AT BOTTOM -->
  <g id="Composer" transform="translate(488, 770)">
    <rect width="700" height="96" rx="20" fill="#0B1324" stroke="#2563EB" stroke-width="1.5" filter="url(#glow_orb)"/>
    
    <!-- Prompt Text Placeholder -->
    <text x="24" y="38" font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#64748B">Hỏi bất kỳ quy chế, chính sách hoàn hủy hoặc gõ &quot;/&quot; để dùng lệnh tắt...</text>

    <!-- Toolbar bottom -->
    <line x1="16" y1="56" x2="684" y2="56" stroke="#182744"/>
    <circle cx="36" cy="74" r="12" fill="#0E1A33"/>
    <text x="36" y="78" font-family="Be Vietnam Pro, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">📎</text>

    <circle cx="68" cy="74" r="12" fill="#0E1A33"/>
    <text x="68" y="78" font-family="Be Vietnam Pro, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">🎙</text>

    <rect x="92" y="62" width="84" height="24" rx="6" fill="#0E2244" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="134" y="78" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="10.5" fill="#38BDF8" text-anchor="middle">🌐 Mạng 3D</text>

    <text x="540" y="77" font-family="Be Vietnam Pro, sans-serif" font-size="11" fill="#64748B">Nhấn <tspan fill="#F8FAFC" font-weight="700">Enter ↵</tspan> để gửi</text>

    <!-- Send button -->
    <rect x="644" y="60" width="36" height="28" rx="10" fill="url(#brand_grad)"/>
    <text x="662" y="78" font-family="Be Vietnam Pro, sans-serif" font-weight="900" font-size="14" fill="white" text-anchor="middle">↑</text>
  </g>
</svg>
